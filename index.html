<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pixel Plumber - Platformer Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(#5c94fc, #a0d8ff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Courier New', monospace;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    overflow-x: hidden;
    padding: 10px;
    user-select: none;
  }
  h1 { margin: 6px 0; letter-spacing: 2px; font-size: clamp(18px, 4vw, 28px); }
  #hud {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
    font-size: clamp(13px, 2.5vw, 18px);
    flex-wrap: wrap;
    justify-content: center;
  }
  #hud span { color: #ffe680; }
  .wrap { position: relative; max-width: 900px; width: 100%; }
  canvas {
    background: #5c94fc;
    border: 5px solid #222;
    border-radius: 6px;
    image-rendering: pixelated;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
  }
  #msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: clamp(16px, 3vw, 26px);
    text-align: center;
    min-height: 24px;
    pointer-events: none;
    width: 90%;
  }
  #controls {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.85;
    text-align: center;
  }
  button {
    margin-top: 10px;
    padding: 8px 18px;
    font-family: inherit;
    font-size: 14px;
    background: #e94560;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #ff6b81; }

  /* mobile touch controls */
  #touchControls {
    display: none;
    width: 100%;
    max-width: 900px;
    justify-content: space-between;
    margin-top: 10px;
  }
  .touchBtn {
    width: 64px; height: 64px;
    background: rgba(0,0,0,0.35);
    border: 3px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
  }
  .dpad { display: flex; gap: 12px; }
  @media (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>
  <h1>PIXEL PLUMBER</h1>
  <div id="hud">
    <div>🪙 <span id="coinCount">0</span>/<span id="coinTotal">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>⏱ <span id="timeLeft">100</span></div>
    <div>🏆 <span id="score">0</span></div>
    <div>🌟 <span id="starStatus" style="display:none;">STAR!</span></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="msg"></div>
  </div>
  <div id="touchControls">
    <div class="dpad">
      <div class="touchBtn" id="btnLeft">◀</div>
      <div class="touchBtn" id="btnRight">▶</div>
    </div>
    <div class="touchBtn" id="btnJump">▲</div>
  </div>
  <div id="controls">Arrow Keys / A D to move · Up / Space / W to jump · P to pause · R to restart</div>
  <button id="restartBtn">Restart</button>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GRAVITY = 0.6;
  const FRICTION = 0.82;

  const coinCountEl = document.getElementById('coinCount');
  const coinTotalEl = document.getElementById('coinTotal');
  const livesEl = document.getElementById('lives');
  const timeLeftEl = document.getElementById('timeLeft');
  const scoreEl = document.getElementById('score');
  const starStatusEl = document.getElementById('starStatus');
  const msgEl = document.getElementById('msg');

  // ---------- Sound (Web Audio, no external files) ----------
  let actx = null;
  function audioCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }
  function beep(freq, dur, type='square', vol=0.15, delay=0) {
    try {
      const ac = audioCtx();
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch(e) {}
  }
  const sfx = {
    jump: () => beep(520, 0.12, 'square', 0.12),
    coin: () => { beep(988, 0.08, 'square', 0.12); beep(1319, 0.1, 'square', 0.1, 0.06); },
    stomp: () => beep(150, 0.12, 'sawtooth', 0.15),
    death: () => { beep(220, 0.2, 'sawtooth', 0.15); beep(140, 0.3, 'sawtooth', 0.15, 0.15); },
    power: () => { [523,659,784,1047].forEach((f,i)=>beep(f,0.12,'square',0.13,i*0.08)); },
    win: () => { [523,659,784,1047,1319].forEach((f,i)=>beep(f,0.15,'triangle',0.15,i*0.1)); },
  };

  // ---------- Level Data ----------
  function buildLevel() {
    return {
      width: 3400,
      platforms: [
        {x:0, y:400, w:900, h:50},
        {x:960, y:400, w:300, h:50},
        {x:1340, y:330, w:150, h:20},
        {x:1560, y:280, w:150, h:20},
        {x:1780, y:400, w:500, h:50},
        {x:2360, y:400, w:200, h:50},
        {x:2640, y:340, w:120, h:20},
        {x:2840, y:400, w:560, h:50},
      ],
      coins: [
        {x:200, y:340}, {x:260, y:340}, {x:320, y:340},
        {x:600, y:340}, {x:660, y:340},
        {x:1000, y:340}, {x:1060, y:340},
        {x:1380, y:280},
        {x:1600, y:230},
        {x:1850, y:340}, {x:1910, y:340}, {x:1970, y:340},
        {x:2400, y:340},
        {x:2680, y:280},
        {x:2900, y:340}, {x:2960, y:340}, {x:3020, y:340}, {x:3080, y:340}, {x:3140, y:340},
      ].map(c => ({...c, taken:false})),
      enemies: [
        {x:500, y:368, w:32, h:32, dir:1, range:[420,760], alive:true},
        {x:1000, y:368, w:32, h:32, dir:-1, range:[970,1240], alive:true},
        {x:1850, y:368, w:32, h:32, dir:1, range:[1800,2200], alive:true},
        {x:2450, y:368, w:32, h:32, dir:1, range:[2380,2540], alive:true},
        {x:2950, y:368, w:32, h:32, dir:-1, range:[2870,3350], alive:true},
      ],
      powerup: {x:1600, y:250, w:22, h:22, taken:false, type:'star'},
      flag: {x:3320, y:250, w:20, h:150}
    };
  }

  let level = buildLevel();
  coinTotalEl.textContent = level.coins.length;

  // ---------- Player ----------
  function makePlayer() {
    return {
      x: 50, y: 300, w: 30, h: 40,
      vx: 0, vy: 0,
      speed: 4.5, jumpPower: -13,
      onGround: false,
      facing: 1,
      invuln: 0,
      starTime: 0,
      walkFrame: 0,
      walkTimer: 0,
      squash: 1
    };
  }
  let player = makePlayer();

  let lives = 3;
  let coins = 0;
  let score = 0;
  let timeLeft = 100;
  let camX = 0;
  let gameState = 'playing'; // playing, paused, won, lost
  let keys = {};
  let particles = [];
  let shake = 0;

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key.toLowerCase() === 'r') restart();
    if (e.key.toLowerCase() === 'p') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  document.getElementById('restartBtn').addEventListener('click', restart);

  // touch controls
  function bindTouch(id, key) {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[key] = true; };
    const off = e => { e.preventDefault(); keys[key] = false; };
    el.addEventListener('touchstart', on);
    el.addEventListener('touchend', off);
    el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
  }
  bindTouch('btnLeft', 'arrowleft');
  bindTouch('btnRight', 'arrowright');
  bindTouch('btnJump', 'arrowup');

  function togglePause() {
    if (gameState === 'playing') { gameState = 'paused'; msgEl.textContent = 'PAUSED'; }
    else if (gameState === 'paused') { gameState = 'playing'; msgEl.textContent = ''; }
  }

  function restart() {
    level = buildLevel();
    coinTotalEl.textContent = level.coins.length;
    player = makePlayer();
    lives = 3;
    coins = 0;
    score = 0;
    timeLeft = 100;
    camX = 0;
    particles = [];
    gameState = 'playing';
    msgEl.textContent = '';
    starStatusEl.style.display = 'none';
    updateHUD();
  }

  function updateHUD() {
    coinCountEl.textContent = coins;
    livesEl.textContent = lives;
    timeLeftEl.textContent = Math.max(0, Math.ceil(timeLeft));
    scoreEl.textContent = score;
    starStatusEl.style.display = player.starTime > 0 ? 'inline' : 'none';
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function spawnParticles(x, y, color, count=8) {
    for (let i=0;i<count;i++) {
      particles.push({
        x, y, vx:(Math.random()-0.5)*6, vy:-Math.random()*5-1,
        life:1, color, size: 3+Math.random()*3
      });
    }
  }

  function resetAfterDeath() {
    sfx.death();
    shake = 12;
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameState = 'lost';
      msgEl.textContent = 'GAME OVER — press R or click Restart';
    } else {
      player = makePlayer();
      camX = 0;
    }
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastTime) / 16.67, 2);
    lastTime = now;
    if (gameState === 'playing') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    timeLeft -= dt * 0.5 / 3;
    if (timeLeft <= 0) { timeLeft = 0; resetAfterDeath(); }

    let moveLeft = keys['arrowleft'] || keys['a'];
    let moveRight = keys['arrowright'] || keys['d'];
    if (moveLeft) { player.vx -= 0.9 * dt; player.facing = -1; }
    if (moveRight) { player.vx += 0.9 * dt; player.facing = 1; }
    player.vx *= FRICTION;
    const maxSpeed = player.starTime > 0 ? player.speed * 1.5 : player.speed;
    if (Math.abs(player.vx) > maxSpeed) player.vx = maxSpeed * Math.sign(player.vx);
    if (Math.abs(player.vx) < 0.05) player.vx = 0;

    // walk animation
    if (player.onGround && Math.abs(player.vx) > 0.3) {
      player.walkTimer += dt;
      if (player.walkTimer > 6) { player.walkTimer = 0; player.walkFrame = (player.walkFrame+1) % 2; }
    } else {
      player.walkFrame = 0;
    }

    let wantJump = keys['arrowup'] || keys[' '] || keys['w'];
    if (wantJump && player.onGround) {
      player.vy = player.jumpPower;
      player.onGround = false;
      player.squash = 1.3;
      sfx.jump();
      spawnParticles(player.x+player.w/2, player.y+player.h, '#fff', 4);
    }

    player.vy += GRAVITY * dt;
    if (player.vy > 18) player.vy = 18;

    player.x += player.vx * dt;
    resolveCollisions('x');
    player.y += player.vy * dt;
    player.onGround = false;
    resolveCollisions('y');

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > level.width) player.x = level.width - player.w;

    // squash/stretch recovery
    player.squash += (1 - player.squash) * 0.2 * dt;

    if (player.y > H + 100) resetAfterDeath();

    // coins
    for (const c of level.coins) {
      if (!c.taken) {
        const cb = {x:c.x-10, y:c.y-10, w:20, h:20};
        if (rectsOverlap(player, cb)) {
          c.taken = true;
          coins++;
          score += 100;
          sfx.coin();
          spawnParticles(c.x, c.y, '#ffd700', 6);
          updateHUD();
        }
      }
    }

    // powerup
    const pu = level.powerup;
    if (pu && !pu.taken && rectsOverlap(player, pu)) {
      pu.taken = true;
      player.starTime = 500; // frames-ish
      score += 500;
      sfx.power();
      spawnParticles(pu.x, pu.y, '#ffea00', 14);
      updateHUD();
    }
    if (player.starTime > 0) player.starTime -= dt;

    // enemies
    for (const en of level.enemies) {
      if (!en.alive) continue;
      en.x += en.dir * 1.5 * dt;
      if (en.x < en.range[0] || en.x + en.w > en.range[1]) en.dir *= -1;

      if (rectsOverlap(player, en)) {
        if (player.starTime > 0) {
          en.alive = false;
          score += 200;
          sfx.stomp();
          spawnParticles(en.x+en.w/2, en.y+en.h/2, '#a83279', 10);
        } else if (player.vy > 0 && (player.y + player.h) - en.y < 18) {
          en.alive = false;
          player.vy = -9;
          score += 200;
          sfx.stomp();
          spawnParticles(en.x+en.w/2, en.y+en.h/2, '#a83279', 10);
        } else if (player.invuln <= 0) {
          player.invuln = 60;
          resetAfterDeath();
        }
      }
    }
    if (player.invuln > 0) player.invuln -= dt;

    // particles
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.3*dt; p.life -= 0.02*dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (shake > 0) shake -= dt;

    // flag / win
    const f = level.flag;
    if (rectsOverlap(player, f) && gameState === 'playing') {
      gameState = 'won';
      score += Math.ceil(timeLeft) * 10;
      sfx.win();
      msgEl.textContent = 'YOU WIN!  Score: ' + score + '  Coins: ' + coins + '/' + level.coins.length + '\n(press R to play again)';
      updateHUD();
    }

    camX = player.x - W/2 + player.w/2;
    if (camX < 0) camX = 0;
    if (camX > level.width - W) camX = level.width - W;

    updateHUD();
  }

  function resolveCollisions(axis) {
    for (const p of level.platforms) {
      if (rectsOverlap(player, p)) {
        if (axis === 'x') {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        } else {
          if (player.vy > 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.squash = 0.8;
          } else if (player.vy < 0) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }
    }
  }

  // ---------- Drawing ----------
  function draw() {
    ctx.clearRect(0,0,W,H);

    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random()-0.5)*shake; sy = (Math.random()-0.5)*shake; }
    ctx.save();
    ctx.translate(sx, sy);

    // parallax hills + clouds
    ctx.fillStyle = '#cdeeff';
    for (let i=0;i<8;i++) {
      const cx = (i*300 - camX*0.15) % (W+300) - 150;
      ctx.beginPath();
      ctx.ellipse(cx, 60+((i%3)*30), 40, 18, 0, 0, Math.PI*2);
      ctx.ellipse(cx+30, 55+((i%3)*30), 30, 15, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#7ec850';
    for (let i = 0; i < 8; i++) {
      const hx = (i*450 - camX*0.3) % (W+400) - 200;
      ctx.beginPath();
      ctx.ellipse(hx, H-20, 150, 60, 0, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.translate(-camX, 0);

    for (const p of level.platforms) {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#6fbf3d';
      ctx.fillRect(p.x, p.y, p.w, 8);
      // brick lines
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      for (let bx = p.x; bx < p.x+p.w; bx += 30) {
        ctx.beginPath(); ctx.moveTo(bx, p.y+8); ctx.lineTo(bx, p.y+p.h); ctx.stroke();
      }
    }

    for (const c of level.coins) {
      if (!c.taken) {
        const bob = Math.sin((performance.now()/200) + c.x) * 3;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y+bob, 10, 10, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#c9a400';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.ellipse(c.x-3, c.y+bob-3, 3, 3, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // powerup
    const pu = level.powerup;
    if (pu && !pu.taken) {
      const bob = Math.sin(performance.now()/150) * 4;
      ctx.save();
      ctx.translate(pu.x+11, pu.y+11+bob);
      ctx.rotate(performance.now()/500);
      ctx.fillStyle = '#ffea00';
      drawStar(0,0,5,14,6);
      ctx.restore();
    }

    for (const en of level.enemies) {
      if (!en.alive) continue;
      ctx.fillStyle = '#a83279';
      ctx.beginPath();
      ctx.ellipse(en.x+en.w/2, en.y+en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(en.x+6, en.y+8, 6, 6);
      ctx.fillRect(en.x+en.w-12, en.y+8, 6, 6);
      ctx.fillStyle = '#222';
      ctx.fillRect(en.x+8, en.y+10, 3, 3);
      ctx.fillRect(en.x+en.w-10, en.y+10, 3, 3);
    }

    // flag
    const f = level.flag;
    ctx.fillStyle = '#ccc';
    ctx.fillRect(f.x, f.y, 6, f.h);
    ctx.fillStyle = '#e94560';
    const wave = Math.sin(performance.now()/200)*4;
    ctx.beginPath();
    ctx.moveTo(f.x+6, f.y);
    ctx.lineTo(f.x+40+wave, f.y+15);
    ctx.lineTo(f.x+6, f.y+30);
    ctx.closePath();
    ctx.fill();

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    drawPlayer();

    ctx.restore(); // camX translate
    ctx.restore(); // shake translate

    if (gameState !== 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0,0,W,H);
    }
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI/2*3, x=cx, y=cy;
    const step = Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy-outerR);
    for (let i=0;i<spikes;i++) {
      x = cx + Math.cos(rot)*outerR; y = cy + Math.sin(rot)*outerR;
      ctx.lineTo(x,y); rot += step;
      x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR;
      ctx.lineTo(x,y); rot += step;
    }
    ctx.lineTo(cx, cy-outerR);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlayer() {
    const p = player;
    const flashing = p.invuln > 0 && Math.floor(p.invuln/4) % 2 === 0;
    if (flashing) return; // blink effect when hurt-invulnerable

    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h);
    ctx.scale(1, p.squash);
    ctx.translate(-p.w/2, -p.h);
    if (p.facing < 0) { ctx.translate(p.w,0); ctx.scale(-1,1); }

    if (p.starTime > 0) {
      const hue = Math.floor(performance.now()/40) % 360;
      ctx.filter = `hue-rotate(${hue}deg) saturate(2)`;
    }

    const legOffset = p.walkFrame === 1 ? 3 : 0;

    // legs
    ctx.fillStyle = '#2255cc';
    ctx.fillRect(6, 34-legOffset, 8, 6+legOffset);
    ctx.fillRect(18, 34+ (p.walkFrame===1?0:legOffset)*0, 8, 6);

    // body (overalls)
    ctx.fillStyle = '#2255cc';
    ctx.fillRect(4, 18, 22, 18);
    // shirt
    ctx.fillStyle = '#e94560';
    ctx.fillRect(2, 10, 26, 12);
    // head
    ctx.fillStyle = '#ffd7a8';
    ctx.fillRect(6, 0, 18, 12);
    // cap
    ctx.fillStyle = '#e94560';
    ctx.fillRect(4, -4, 22, 8);
    ctx.fillRect(20, 0, 10, 4);
    // eyes
    ctx.fillStyle = '#222';
    ctx.fillRect(18, 4, 3, 3);
    // mustache
    ctx.fillStyle = '#5a3825';
    ctx.fillRect(12, 8, 10, 3);

    ctx.filter = 'none';
    ctx.restore();
  }

  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
